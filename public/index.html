<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artifact Annotator</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preload" href="/static/fonts/ia-writer-quattro-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/ia-writer-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <main class="workspace">
      <section id="reader" class="reader">
        <div id="inspect-strip" class="inspect-strip" hidden>
          <span id="inspect-state" class="state fact">Inspector on. Click anything in the app to annotate it.</span>
          <button id="toggle-inspect" class="btn btn--ghost">Pause inspector</button>
        </div>
        <article id="markdown-artifact" class="doc" hidden></article>
        <iframe
          id="html-artifact"
          class="html-artifact"
          title="Artifact under review"
          sandbox="allow-scripts allow-forms allow-modals allow-popups"
          hidden></iframe>
      </section>

      <aside class="review">
        <header class="review-head">
          <div class="review-id">
            <span id="artifact-name" class="artifact-path fact">Opening artifact</span>
            <span class="review-status fact">
              <span><span class="held-cursor"></span>held<span id="held-clock" style="margin-left:9px">00:00</span></span>
              <span id="save-state" class="save-state">draft saved</span>
            </span>
          </div>
          <button id="submit-review" class="btn btn--send">Send notes back</button>
        </header>

        <div id="feed" class="feed">
          <section class="overall">
            <label for="overall-feedback">Anything that applies to the whole artifact</label>
            <textarea
              id="overall-feedback"
              class="field"
              rows="2"
              placeholder="Optional. The agent reads this before the anchored notes."></textarea>
          </section>
          <p id="empty-state" class="idle">
            No notes yet. Select a passage, or hover a block and use the + in its margin.
          </p>
          <ol id="annotation-list" class="entries"></ol>
        </div>

        <div id="composer" class="prompt">
          <div id="anchor-card" class="anchor-line" role="status" aria-live="polite"></div>
          <textarea
            id="annotation-comment"
            class="field"
            aria-label="Note on the selected anchor"
            rows="3"
            placeholder="Select a passage, then say what should change."
            disabled></textarea>
          <div class="prompt-row">
            <div id="intent-picker" class="intents" role="group" aria-label="Kind of note">
              <button class="intent" data-intent="change" aria-pressed="true">
                <span class="glyph glyph--change"></span>Change
              </button>
              <button class="intent" data-intent="question" aria-pressed="false">
                <span class="glyph glyph--question"></span>Question
              </button>
              <button class="intent" data-intent="note" aria-pressed="false">
                <span class="glyph glyph--note"></span>Note
              </button>
            </div>
            <button id="add-annotation" class="btn btn--ghost" disabled>Add note</button>
          </div>
        </div>
      </aside>
    </main>

    <div id="submitted" class="sent" hidden>
      <div class="sent-inner">
        <div id="sent-marks" class="sent-marks"></div>
        <h2>Sent. Your terminal has it.</h2>
        <p id="sent-detail">Close this tab whenever you like.</p>
      </div>
    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
