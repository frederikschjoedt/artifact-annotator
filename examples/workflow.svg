<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title description">
  <title id="title">Artifact annotation workflow</title>
  <desc id="description">A document flows through annotation and back to an agent.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #20201d; }
    .box { fill: #f8f4ea; stroke: #315b78; stroke-width: 3; }
    .arrow { stroke: #df6335; stroke-width: 4; marker-end: url(#arrowhead); }
  </style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#df6335"/></marker></defs>
  <g id="artifact"><rect class="box" x="20" y="55" width="170" height="70" rx="8"/><text x="105" y="96" text-anchor="middle">Artifact</text></g>
  <line class="arrow" x1="190" y1="90" x2="265" y2="90"/>
  <g id="annotation"><rect class="box" x="275" y="55" width="170" height="70" rx="8"/><text x="360" y="96" text-anchor="middle">Annotation</text></g>
  <line class="arrow" x1="445" y1="90" x2="520" y2="90"/>
  <g id="agent"><rect class="box" x="530" y="55" width="170" height="70" rx="8"/><text x="615" y="96" text-anchor="middle">Agent</text></g>
</svg>
