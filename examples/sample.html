<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Report</title>
  <style>
    body { margin: 0; color: #172126; background: #e8efe9; font-family: system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 8vw 30px; }
    h1 { max-width: 700px; margin: 0; font: 700 clamp(52px, 9vw, 100px)/.9 Georgia, serif; letter-spacing: -.06em; }
    .kicker { color: #bc4d2c; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 60px; }
    article { padding: 22px; background: #f8faf6; border-top: 4px solid #172126; }
    article strong { display: block; font: 42px Georgia, serif; }
    @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Quarterly signal report</p>
    <h1>Clarity compounds faster than output.</h1>
    <section class="grid">
      <article><strong>18</strong><span>decisions made</span></article>
      <article><strong>4.2×</strong><span>faster feedback</span></article>
      <article><strong>91%</strong><span>context retained</span></article>
    </section>
  </main>
</body>
</html>
